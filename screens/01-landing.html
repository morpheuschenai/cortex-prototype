<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cortex — 輸入品牌網址</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .landing-form { max-width: 620px; margin: 40px 0; }
    .landing-form-row { display: flex; gap: 12px; }
    .landing-form-row .input { flex: 1; }
    .landing-mode-hint {
      margin-top: 12px;
      font: 400 13px/1.5 var(--font-sans);
      color: var(--color-neutral-500);
    }
    .partners {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--color-neutral-200);
    }
    .partners-label {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--color-neutral-500);
      margin-bottom: 16px;
    }
    .partners-logos {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 40px;
    }
    .partner-logo {
      height: 24px;
      opacity: .7;
      filter: grayscale(100%);
    }
    .partner-logo:hover { opacity: 1; filter: none; }
    .partners-more {
      font: 500 13px var(--font-sans);
      color: var(--color-neutral-500);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="page-header">
      <div class="page-eyebrow">Stage 00 · Discovery</div>
      <h1 class="page-title">輸入品牌網址,讓 Cortex 用媒體的語言介紹你的品牌。</h1>
      <p class="page-subtitle">
        不是插入的廣告,是讀者會想讀完的延伸閱讀。
      </p>
    </div>

    <form class="landing-form" onsubmit="event.preventDefault(); window.location.href='02-media-fit.html';">
      <label class="label" for="brandUrl">品牌網址</label>
      <div class="landing-form-row">
        <input
          type="url"
          id="brandUrl"
          class="input"
          placeholder="https://your-brand.com"
          value="https://health-forward.tw"
          required
        />
        <button type="submit" class="btn btn-primary btn-arrow">開始分析</button>
      </div>
      <div class="landing-mode-hint">
        目前為
        <span class="hint">
          <strong>快速掃描</strong>
          <span class="hint-tip">從網站標題、meta、內容結構抓取品牌 signal,不動用 AI 深度分析,秒級完成。深度分析在後續 stage 才會啟動。</span>
        </span>
        · 秒級完成、不動用 AI token 成本
      </div>
    </form>

    <section class="partners">
      <div class="partners-label">合作媒體 · 健康 / 生活 / 財經</div>
      <div class="partners-logos">
        <img src="../assets/logos/Bella.webp" alt="Bella" class="partner-logo" style="height:20px" />
        <img src="../assets/logos/cmoney.svg" alt="CMoney" class="partner-logo" />
        <img src="../assets/logos/now.svg" alt="NOWnews" class="partner-logo" />
        <img src="../assets/logos/today.png" alt="Business Today" class="partner-logo" />
        <span class="partners-more">+ 11 家</span>
      </div>
    </section>
  </main>
  <script src="../nav.js"></script>
</body>
</html>
